<html lang="en" style="background-color:#054e60">

    <meta charset="UTF-8" />

    <meta name="theme-color" content="#054e60" />

    <link rel="preconnect" href="https://lib.arvancloud.ir" crossorigin />
    <link rel="preconnect" href="https://avatars.githubusercontent.com" crossorigin />
    <!-- non-blocking font load: preload fires early, onload swaps rel to stylesheet -->
    <link
      rel="preload"
      href="https://lib.arvancloud.ir/vazir-font/33.003/Vazirmatn-font-face.css"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://lib.arvancloud.ir/vazir-font/33.003/Vazirmatn-font-face.css" />
    </noscript>
  </head>
